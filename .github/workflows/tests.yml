name: Synthetic tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt SimpleITK
      - run: python -m pytest -q
      - run: python tools/review.py --summary examples/synthetic-summary.json --dataset examples/dataset.json --out runtime/demo
